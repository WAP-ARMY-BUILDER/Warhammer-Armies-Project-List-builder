let army=[];function uid(){return Math.random().toString(36).slice(2,9)}function add(cat,i){let u=structuredClone(data[cat][i]);u.cat=cat;u.id=uid();u.qty=u.char?1:(u.min||1);u.selected={};army.push(u);render()}function cost(u){let c=u.base||((u.ppm||0)*u.qty);for(const [k,v] of Object.entries(u.selected||{}))if(v){if(String(v).startsWith('ppm:'))c+=Number(v.split(':')[1])*u.qty;else c+=Number(v)}return c}function renderCatalog(){catalog.innerHTML=Object.entries(data).map(([cat,us])=>`<div class=cat><h2>${cat}</h2>${us.map((u,i)=>`<div class=unit><div><b>${u.name}</b><br><small>${u.base?u.base+' pts':u.ppm+' pts/model'}${u.min?' • min '+u.min:''}</small></div><button onclick="add('${cat}',${i})">Add</button></div>`).join('')}</div>`).join('')}
function renderArmy(){armyEl=document.getElementById('army');if(!army.length){armyEl.innerHTML='<p class=tiny>No selections yet. Add units from the middle panel.</p>';return}armyEl.innerHTML=army.map(u=>`<div class=armyItem><h3>${u.name}<span class=pill>${u.cat}</span></h3><div class=opts>${!u.char?`<label>Models <input type=number min=${u.min||1} ${u.max?`max=${u.max}`:''} value=${u.qty} onchange="qty('${u.id}',this.value)"></label>`:''}${(u.options||[]).map((o,j)=>`<label><input type=checkbox ${u.selected[o[0]]?'checked':''} onchange="opt('${u.id}',${j},this.checked)"> ${o[0]}</label>`).join('')}</div><div style='display:flex;justify-content:space-between;margin-top:7px'><b>${cost(u)} pts</b><button class=danger onclick="removeU('${u.id}')">Remove</button></div></div>`).join('')}
function qty(id,v){let u=army.find(x=>x.id==id);u.qty=Math.max(u.min||1,Number(v)||1);if(u.max)u.qty=Math.min(u.qty,u.max);render()}function opt(id,j,on){let u=army.find(x=>x.id==id),o=u.options[j];u.selected[o[0]]=on?o[1]:false;render()}function removeU(id){army=army.filter(x=>x.id!=id);render()}function renderMetrics(){let lim=Number(limit.value)||2000,sums={Lords:0,Heroes:0,Core:0,Special:0,Rare:0};army.forEach(u=>sums[u.cat]+=cost(u));let total=Object.values(sums).reduce((a,b)=>a+b,0);metrics.innerHTML=`<div class=metric><b>Total</b><b class=${total>lim?'bad':'good'}>${total} / ${lim}</b></div>`+Object.entries(sums).map(([k,v])=>`<div class=metric><span>${k}</span><span>${v} (${(v/lim*100).toFixed(1)}%)</span></div>`).join('');let issues=[];if(total>lim)issues.push(`Army is ${total-lim} points over the limit.`);if(sums.Lords>lim*.25)issues.push('Lords exceed 25%.');if(sums.Heroes>lim*.35)issues.push('Heroes exceed 35%.');if(sums.Lords+sums.Heroes>lim*.35)issues.push('Lords + Heroes exceed 35%.');if(sums.Core<lim*.25)issues.push(`Core is below the 25% minimum (${Math.ceil(lim*.25)} pts).`);if(sums.Special>lim*.5)issues.push('Special exceeds 50%.');if(sums.Rare>lim*.25)issues.push('Rare exceeds 25%.');let rank=army.filter(u=>!u.char).length,need=Math.ceil(lim/500);if(rank<need)issues.push(`Needs at least ${need} Core/Special/Rare units; currently ${rank}.`);if(!army.some(u=>u.char))issues.push('Army needs at least one Lord or Hero to be General.');for(let u of army)if(!u.char&&u.qty<(u.min||1))issues.push(`${u.name} is below minimum size.`);for(let cat of ['Special','Rare']){let counts={};army.filter(u=>u.cat==cat).forEach(u=>counts[u.name]=(counts[u.name]||0)+1);let max=cat==='Special'?4:2;for(let [n,c] of Object.entries(counts))if(c>max)issues.push(`${n}: ${c} duplicates exceeds the standard ${cat} limit of ${max}.`)}validation.innerHTML=issues.length?issues.map(x=>`<div class=warn>${x}</div>`).join(''):`<div class=ok>No prototype legality issues detected.</div>`}
function save(){localStorage.setItem('heArmy',JSON.stringify({army,limit:limit.value}));alert('Roster saved in this browser.')}function load(){let x=JSON.parse(localStorage.getItem('heArmy')||'null');if(x){army=x.army;limit.value=x.limit;render()}}function clearArmy(){army=[];render()}function render(){renderCatalog();renderArmy();renderMetrics()}render();
</script>

'Archmage':{limit:100,wizard:true,levels:[['Level 3',0],['Level 4',35]],mounts:[['On foot',0],['Elven Steed',18],['Great Eagle',50],['Pegasus',30],['Sun Dragon',180],['Moon Dragon',230]],extras:[]},

'Noble':{limit:50,weapons:[['None',0],['Additional hand weapon',3],['Spear',3],['Lance',5],['Great weapon',5],['Polearm',5]],armour:[['Medium armour',0],['Heavy armour',2],['Dragon armour',4]],mounts:[['On foot',0],['Ithilmar barded Elven Steed',20],['Pegasus',30],['Great Eagle',50],['Tiranoc Chariot',70],['Griffon',150]],extras:[['Elven longbow',5],['Lion cloak',2],['Shield',2],['Battle Standard Bearer',25]]},

for(const cat of ['Lords','Heroes']) for(const u of data[cat]) Object.assign(u,{profile:profiles[u.name]||{limit:50,mounts:[['On foot',0]],extras:[]}});
const oldAdd=add; add=function(cat,i){oldAdd(cat,i);let u=army[army.length-1];if(u.char){u.weapon=0;u.armour=0;u.mount=0;u.level=0;u.extras={};u.items=[];}};
function charCost(u){let p=u.profile||{},c=u.base+(Number(u.weapon)||0)+(Number(u.armour)||0)+(Number(u.mount)||0)+(Number(u.level)||0);for(const v of Object.values(u.extras||{}))c+=Number(v)||0;for(const x of u.items||[])c+=Number(x.p)||0;return c}

function charEditor(u){let p=u.profile||{},spent=(u.items||[]).reduce((a,b)=>a+(b.p||0),0),over=spent>p.limit;let wizard=!!p.wizard;let chosenTypes={};(u.items||[]).forEach(x=>{if(x.t)chosenTypes[x.t]=(chosenTypes[x.t]||0)+1});return `<div class=charbox><div class=chargrid>${p.weapons?`<label>Weapon${sel(p.weapons,u.weapon,u.id,'weapon')}</label>`:''}${p.armour?`<label>Armour${sel(p.armour,u.armour,u.id,'armour')}</label>`:''}${p.mounts?`<label>Mount${sel(p.mounts,u.mount,u.id,'mount')}</label>`:''}${p.levels?`<label>Wizard level${sel(p.levels,u.level,u.id,'level')}</label>`:''}</div>${(p.extras||[]).length?`<div class=sectiontitle>Options</div><div class=opts>${p.extras.map(x=>`<label><input type=checkbox ${(u.extras||{})[x[0]]?'checked':''} onchange="extra('${u.id}','${x[0]}',${x[1]},this.checked)">${x[0]} (+${x[1]})</label>`).join('')}</div>`:''}<div class=sectiontitle>Magic items <span class="budget ${over?'over':''}">${spent}/${p.limit} pts</span></div>${(u.items||[]).map((it,i)=>`<div class=itemline><select onchange="setItem('${u.id}',${i},this.value)"><option value=''>Choose an item…</option>${[...new Set(magicItems.map(x=>x.t))].map(t=>`<optgroup label="${t}">${magicItems.filter(m=>m.t==t&&(!m.wizard||wizard)).map(m=>`<option ${it.n==m.n?'selected':''} value="${m.n}">${m.n} (${m.p})</option>`).join('')}</optgroup>`).join('')}</select><button class=danger onclick="delItem('${u.id}',${i})">×</button></div>`).join('')}<button class=secondary onclick="addItem('${u.id}')">+ Magic item</button><div class=notes>One item from each category per character. Arcane items are shown only to Wizards. Army-wide duplicates are flagged.</div></div>`}

<style>.bannerbox{background:#fff8e7;border:1px solid #dfc77d;border-radius:8px;padding:8px;margin-top:8px}.bannerbox select{width:100%}</style>
<script>
const magicBanners=[
 {n:'Battle Banner',p:70,src:'London'}, {n:'Banner of Might',p:55,src:'London'}, {n:'Standard of Shielding',p:25,src:'London'}, {n:'Standard of Arcane Warding',p:20,src:'London'}, {n:"Ranger’s Standard",p:20,src:'London'}, {n:'Wailing Banner',p:35,src:'London'}, {n:'Banner of Defiance',p:40,src:'London'}, {n:"Rampager’s Standard",p:35,src:'London'}, {n:'Razor Standard',p:30,src:'London'}, {n:'Banner of Valour',p:15,src:'London'}, {n:'Banner of Swiftness',p:15,src:'London'}, {n:'Banner of Courage',p:15,src:'London'}, {n:'Standard of Discipline',p:15,src:'London'}, {n:'Banner of Ice and Fire',p:10,src:'London'}, {n:'Lichbone Pennant',p:10,src:'London'}, {n:'Banner of Eternal Flame',p:10,src:'London'}, {n:'Banner of Duty',p:5,src:'London'}, {n:'Scarecrow Banner',p:5,src:'London'},
 {n:'Banner of Sorcery',p:50,src:'High Elf supplement'}, {n:'Standard of Balance',p:45,src:'High Elf supplement'}, {n:'Banner of Ellyrion',p:25,src:'High Elf supplement'}, {n:'Lion Standard',p:10,src:'High Elf supplement'}
];
const bannerLimits={'Archers':25,'Spearmen':25,'Warriors':25,'Lothern Sea Guard':25,'Silver Helms':50,'Swordmasters of Hoeth':50,'White Lions of Chrace':50,'Dragon Princes of Caledor':50,'Phoenix Guard':50,'Handmaidens of the Everqueen':50};
function bannerOptions(limit,chosen){return `<option value="">No magic standard</option>`+magicBanners.filter(b=>b.p<=limit).map(b=>`<option value="${b.n}" ${chosen===b.n?'selected':''}>${b.n} (${b.p} pts) — ${b.src}</option>`).join('')}
function setBanner(id,name){let u=army.find(x=>x.id===id);u.banner=name||'';if(u.banner&&!u.char){let key=Object.keys(u.selected||{}).find(k=>k.toLowerCase().includes('standard'));if(key&&!u.selected[key])u.selected[key]=10;}render()}
const prevCostBanner=cost; cost=function(u){let c=prevCostBanner(u);if(u.banner){let b=magicBanners.find(x=>x.n===u.banner);if(b)c+=b.p}return c}
function unitBannerEditor(u){let limit=bannerLimits[u.name];if(!limit)return '';let key=Object.keys(u.selected||{}).find(k=>k.toLowerCase().includes('standard'));let hasStd=key&&u.selected[key];return `<div class=bannerbox><label>Magic standard (max ${limit} pts)<select onchange="setBanner('${u.id}',this.value)">${bannerOptions(limit,u.banner||'')}</select></label><div class=notes>${hasStd?'Standard bearer selected.':'Choosing a magic standard will automatically add the unit standard bearer (+10 pts).'}</div></div>`}
function bsbEditor(u){if(u.name!=='Noble'||!(u.extras||{})['Battle Standard Bearer'])return '';let limit=50;return `<div class=bannerbox><label>Battle Standard magic banner<select onchange="setBanner('${u.id}',this.value)">${bannerOptions(limit,u.banner||'')}</select></label><div class=notes>BSB may carry a magic standard; its cost is added to the character. Character magic-item allowance validation remains separate.</div></div>`}
const oldRA_banner=renderArmy; renderArmy=function(){oldRA_banner();document.querySelectorAll('.armyItem').forEach((card,i)=>{let u=army[i];if(!u)return;let box=u.char?bsbEditor(u):unitBannerEditor(u);if(box)card.insertAdjacentHTML('beforeend',box)})}
const oldRM_banner=renderMetrics;renderMetrics=function(){oldRM_banner();let used={};army.forEach(u=>{if(u.banner)used[u.banner]=(used[u.banner]||0)+1});let issues=[];for(const [n,c] of Object.entries(used))if(c>1)issues.push(`${n} is selected ${c} times; magic standards are unique.`);army.forEach(u=>{if(u.banner){let b=magicBanners.find(x=>x.n===u.banner),lim=u.char?50:bannerLimits[u.name];if(b&&lim&&b.p>lim)issues.push(`${u.name}: ${b.n} exceeds the ${lim}-point magic standard allowance.`)}});if(issues.length)validation.innerHTML+=issues.map(x=>`<div class=warn>${x}</div>`).join('')}
render();
</script>
